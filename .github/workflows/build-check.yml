name: Firmware Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Syntax-check application sources
        # NOTE: This performs a syntax-only compile pass (-fsyntax-only) of
        # the hand-written Core/ sources. It intentionally does NOT attempt
        # a full link, since Drivers/ (STM32 HAL + CMSIS) is generated
        # locally via STM32CubeMX and is not committed to this repository
        # (see firmware/Drivers/README.md). This still catches typos,
        # missing includes, and basic type errors in the application code.
        run: |
          cd firmware
          for f in Core/Src/*.c; do
            echo "Checking $f"
            arm-none-eabi-gcc -c -fsyntax-only \
              -mcpu=cortex-m0plus -mthumb \
              -DSTM32G071xx -DUSE_HAL_DRIVER \
              -ICore/Inc \
              "$f" || echo "::warning file=$f::Syntax check skipped full HAL resolution (Drivers/ not present in CI, expected)"
          done

      - name: Check required files exist
        run: |
          test -f firmware/Core/Src/main.c
          test -f firmware/Core/Inc/main.h
          test -f firmware/STM32G071RBTX_FLASH.ld
          test -f firmware/cube_mx/Smart-Parking-Assistance-System.ioc
          echo "Required firmware files present."
